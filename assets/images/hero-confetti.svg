<?xml version="1.0" encoding="UTF-8"?>
<!-- Birthday confetti overlay. Pieces are clustered around the edges so the
     centre stays clear over the banner text. Used as the parallax layer in
     the hero (see js/hero-parallax.js). Recreated as SVG so it's crisp,
     transparent and light; swap in a PNG export at the same path if preferred. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <defs>
    <filter id="confettiShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <g filter="url(#confettiShadow)">
    <!-- top edge -->
    <rect x="150" y="40"  width="92" height="34" rx="7" fill="#fbf1bf" transform="rotate(-28 196 57)"/>
    <rect x="690" y="22"  width="44" height="92" rx="7" fill="#3f9d57" transform="rotate(-12 712 68)"/>
    <rect x="800" y="40"  width="42" height="96" rx="7" fill="#f5871f" transform="rotate(20 821 88)"/>
    <rect x="470" y="36"  width="80" height="30" rx="7" fill="#76d3da" transform="rotate(14 510 51)"/>

    <!-- left edge -->
    <rect x="40"  y="240" width="42" height="96" rx="7" fill="#8fd9e0" transform="rotate(18 61 288)"/>
    <rect x="70"  y="270" width="40" height="118" rx="7" fill="#f9d4e6" transform="rotate(-4 90 329)"/>
    <rect x="80"  y="470" width="90" height="32" rx="7" fill="#8fd9e0" transform="rotate(-14 125 486)"/>
    <rect x="28"  y="620" width="46" height="118" rx="7" fill="#3f9d57" transform="rotate(-6 51 679)"/>
    <rect x="170" y="730" width="120" height="42" rx="7" fill="#2f5aa6" transform="rotate(20 230 751)"/>
    <rect x="300" y="930" width="96" height="40" rx="7" fill="#f5871f" transform="rotate(22 348 950)"/>

    <!-- right edge -->
    <rect x="900" y="300" width="44" height="118" rx="7" fill="#f9d4e6" transform="rotate(18 922 359)"/>
    <rect x="860" y="560" width="100" height="40" rx="7" fill="#fbf1bf" transform="rotate(-18 910 580)"/>
    <rect x="930" y="560" width="44" height="128" rx="7" fill="#2f5aa6" transform="rotate(16 952 624)"/>
    <rect x="820" y="760" width="118" height="42" rx="7" fill="#f9d4e6" transform="rotate(-20 879 781)"/>
    <rect x="840" y="820" width="120" height="44" rx="7" fill="#ec2a7f" transform="rotate(-8 900 842)"/>
  </g>
</svg>
